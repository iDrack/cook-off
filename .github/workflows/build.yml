name: Test and Build Production Artifact

on:
    push:
        branches: [main, master]
    workflow_dispatch:

jobs:
    build-docker-image:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Create production repertory
              run: mkdir -p production-deploy
            
            - name: Build Docker image
              run: |
                docker build \
                  -t cookoff:latest \
                  -t cookoff:${{ github.sha }} \
                  .
            
            - name: Save image as tar
              run: |
                docker save cookoff:latest cookoff:${{ github.sha }} -o production-deploy/cookoff-image.tar
            
            - name: Copy deployment files
              run: |
                cp docker-compose.yml production-deploy/
                cp Dockerfile production-deploy/ || true

            - name: Generate deploy script
              run: |
                cat > production-deploy/deploy.sh << 'EOF'
                #!/usr/bin/env sh
                set -eu
                docker load -i cookoff-image.tar
                docker compose up -d
                EOF
                chmod +x production-deploy/deploy.sh
                
            - name: Upload production artifact
              uses: actions/upload-artifact@v4
              with:
                  name: cookoff-docker
                  path: production-deploy/
                  retention-days: 30
                  include-hidden-files: true

    build-bundle:
        runs-on: ubuntu-latest

        steps: 
          - name: Checkout code
            uses: actions/checkout@v6

          - uses: actions/setup-node@v6
            with:
              node-version: 24

          - name: Enable corepack and pin pnpm
            run: |
              corepack enable
              corepack prepare pnpm@10.33.2 --activate

          - name: Install dependencies
            run: pnpm install --frozen-lockfile
          
          - name: Build application
            run: pnpm build

          - name: Upload production bundle
            uses: actions/upload-artifact@v4
            with:
                name: cookoff-build
                path: .output/
                retention-days: 30
                include-hidden-files: true

