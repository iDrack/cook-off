name: Test and Build Production Artifact

on:
    push:
        branches: [main, master]
    workflow_dispatch:

jobs:
    build-docker-image:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Create production repertory
              run: |
                mkdir -p production-deploy
            
            - name: Build Docker image and save as tar file
              run: |
                docker build -t cookoff:latest .
                docker save cookoff:latest -o production-deploy/cookoff-image.tar

            - name: Copy production image
              run: |
                cp -r docker/ production-deploy 2>/dev/null || true

            - name: Copy Docker Compose
              run: |
                cp docker-compose.yml production-deploy

            - name: Copy Dockerfile
              run: |
                cp Dockerfile production-deploy
                
            - name: Upload production image
              uses: actions/upload-artifact@v4
              with:
                  name: cookoff-docker
                  path: production-deploy/
                  retention-days: 30
                  include-hidden-files: true

    build-bundle:
        runs-on: ubuntu-latest

        steps: 
          - name: Checkout code
            uses: actions/checkout@v6

          - uses: actions/setup-node@v6
            with:
              node-version: 24

          - name: Enable corepack and pin pnpm
            run: |
              corepack enable
              corepack prepare pnpm@10.33.2 --activate

          - name: Install dependencies
            run: pnpm install --frozen-lockfile
          
          - name: Build application
            run: pnpm build

          - name: Upload production bundle
            uses: actions/upload-artifact@v4
            with:
                name: cookoff-build
                path: .output/
                retention-days: 30
                include-hidden-files: true

